name: Poker Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test (C++ / Linux)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libssl-dev \
          libsqlite3-dev \
          ccache \
          git

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-${{ github.ref }}
        restore-keys: ${{ runner.os }}-

    - name: Configure CMake
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run fast unit tests
      run: |
        cd build
        ./tests/poker_tests --gtest_output=xml:test_results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/**/test_results.xml

  slow-tests:
    name: Slow Tests (CFR Solver)
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev

    - name: Configure & Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)

    - name: Run slow tests (CFR solver, up to 10min)
      run: |
        cd build
        timeout 600 ./tests/poker_slow_tests --gtest_output=xml:slow_test_results.xml || echo "Some slow tests timed out"

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang-tidy clang-format

    - name: Check code formatting
      run: |
        find . -name '*.cpp' -o -name '*.h' | grep -v third_party | xargs clang-format --dry-run --Werror

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install dependencies
      run: npm ci 2>/dev/null || npm install

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

  docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          pokerteam/poker-engine:latest
          pokerteam/poker-engine:${{ github.sha }}
