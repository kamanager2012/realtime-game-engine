# =============================================================================
# Nginx 配置 — TLS 终止 + WebSocket 代理 (multi-instance sticky)
# =============================================================================

upstream poker_ws {
    ip_hash;
    server poker-server-1:9001;
    server poker-server-2:9001;
}

upstream poker_api {
    least_conn;
    server poker-server-1:9001;
    server poker-server-2:9001;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name poker.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name poker.example.com;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # WebSocket 代理
    location /ws {
        proxy_pass http://poker_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;

        # 缓冲区优化
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 观战 WebSocket
    location /spectator {
        proxy_pass http://poker-server:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # HTTP API
    location /api {
        proxy_pass http://poker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 限流
        limit_req zone=api_limit burst=20 nodelay;
    }

    # 静态文件 (前端)
    location / {
        proxy_pass http://poker-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://poker_api/health;
        access_log off;
    }

    # 指标端点（Basic Auth 保护）
    location /metrics {
        auth_basic "Metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://poker-server:9090;
    }

    # 日志
    access_log /var/log/nginx/poker_access.log;
    error_log /var/log/nginx/poker_error.log;
}

# API 限流区域
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn conn_limit_per_ip 50;
