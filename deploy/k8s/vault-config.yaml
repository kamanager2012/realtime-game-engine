# =============================================================================
# Vault 密钥管理配置（可选：如果使用 HashiCorp Vault）
# =============================================================================

# Vault Agent Injector (自动注入密钥为文件)
# 需要在 K8s 集群中安装 vault-secrets-operator 或 vault-agent-injector

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poker-server
  namespace: poker-engine
  annotations:
    # Vault Agent Sidecar 注入
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-status: "update"
    vault.hashicorp.com/role: "poker-server"

    # 注入密钥
    vault.hashicorp.com/agent-inject-secret-jwt-signing-key: "secret/data/poker-engine/jwt"
    vault.hashicorp.com/agent-inject-secret-db-cred: "database/creds/poker-app-role"
    vault.hashicorp.com/agent-inject-secret-tls-cert: "secret/data/poker-engine/tls"

    # 模板化环境变量
    vault.hashicorp.com/agent-inject-template-jwt-signing-key: |-
      {{- with secret "secret/data/poker-engine/jwt" -}}
      export JWT_SIGNING_KEY="{{ .Data.data.key }}"
      {{- end -}}
    vault.hashicorp.com/agent-inject-template-db-cred: |-
      {{- with secret "database/creds/poker-app-role" -}}
      export DB_USERNAME="{{ .Data.username }}"
      export DB_PASSWORD="{{ .Data.password }}"
      {{- end -}}

spec:
  serviceName: poker-server
  selector:
    matchLabels:
      app: poker-server
  template:
    metadata:
      labels:
        app: poker-server
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/poker-engine/jwt"
    spec:
      serviceAccountName: poker-server
      containers:
      - name: poker-server
        image: pokerteam/poker-engine:v0.4.0
        env:
        - name: JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: poker-secrets
              key: jwt-signing-key
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: poker-db-cred
              key: password
        # TLS 证书挂载 (Vault Agent 注入)
        volumeMounts:
        - name: vault-jwt-key
          mountPath: /vault/secrets
          readOnly: true
      volumes:
      - name: vault-jwt-key
        emptyDir:
          medium: Memory
---
# Vault policy for poker server
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poker-server-secrets
  namespace: poker-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: poker-runtime-secrets
    creationPolicy: Owner
  data:
  - secretKey: jwt-signing-key
    remoteRef:
      key: secret/data/poker-engine/jwt
      property: key
  - secretKey: db-username
    remoteRef:
      key: database/creds/poker-app-role
      property: username
  - secretKey: db-password
    remoteRef:
      key: database/creds/poker-app-role
      property: password
  - secretKey: tls-cert
    remoteRef:
      key: secret/data/poker-engine/tls
      property: cert
  - secretKey: tls-key
    remoteRef:
      key: secret/data/poker-engine/tls
      property: key
